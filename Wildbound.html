<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101b2d"><title>Wildbound</title>
<style>
:root{--ink:#f5f4e8;--muted:#b9c8d0;--gold:#ffd36b;--panel:#182b3d;--line:#46647a;--green:#77d69b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#24455a,#0d1727 70%);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}.app{max-width:900px;margin:auto;padding:12px}.top{display:flex;align-items:center;gap:10px;justify-content:space-between}.brand{font-weight:1000;letter-spacing:2px;color:var(--gold);font-size:clamp(18px,4vw,26px)}button{border:1px solid #607c8e;border-radius:12px;background:#28445a;color:white;padding:10px 13px;font-weight:800;font-size:14px;cursor:pointer;touch-action:manipulation}button:active{transform:translateY(1px);filter:brightness(1.2)}button.primary{background:linear-gradient(135deg,#ffd36b,#f49c56);color:#2c2630;border:0}.layout{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:12px;margin-top:12px}.main,.side,.panel{background:linear-gradient(145deg,#1b3348,#142638);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:0 12px 32px #0003}.screen{position:relative;width:100%;aspect-ratio:3/2;background:#182e36;border-radius:12px;overflow:hidden;border:3px solid #5e8291}.screen canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}.caption{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px;padding:8px 2px}.side h3{margin:4px 0 8px;color:var(--gold)}.team{display:grid;gap:7px}.mon{background:#102235;border:1px solid #3c5b70;border-radius:12px;padding:8px;display:grid;grid-template-columns:42px 1fr;gap:8px;align-items:center}.sprite{font-size:30px;text-align:center}.mon small{color:var(--muted)}.bar{height:7px;background:#3c4650;border-radius:8px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:#7de0a4}.controls{display:grid;grid-template-columns:repeat(3,58px);gap:6px;justify-content:center;margin:12px auto 2px}.controls button{height:48px;font-size:20px;padding:0}.controls .blank{visibility:hidden}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.actions button{flex:1}.log{background:#0e1e2c;border:1px solid #39566a;border-radius:12px;padding:10px;min-height:54px;margin-top:10px;color:#dce8e7;font-size:13px}.overlay{position:fixed;inset:0;background:#06111de8;display:none;align-items:center;justify-content:center;padding:14px;z-index:5}.dialog{width:min(620px,100%);background:linear-gradient(145deg,#24445a,#12283a);border:2px solid #7595a5;border-radius:22px;padding:16px;box-shadow:0 20px 70px #0009}.dialog h2{margin:0 0 10px;color:var(--gold)}.battlefield{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end;min-height:150px;background:linear-gradient(#8dc9ce 0 55%,#78b77c 55%);border-radius:14px;padding:14px;color:#1b2c35}.creature{font-size:clamp(56px,15vw,90px);text-align:center;filter:drop-shadow(0 7px 2px #2345)}.status{background:#f5f0d8;border:2px solid #53656b;border-radius:10px;padding:8px;font-size:12px;color:#1c2a30}.status b{font-size:15px}.battle-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.starter-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.starter{padding:12px 5px;background:#10283b;border:1px solid #57768a;border-radius:14px;text-align:center}.starter span{display:block;font-size:42px}.starter b{display:block}.starter small{color:var(--muted)}.tabs{display:flex;gap:6px;flex-wrap:wrap}.hidden{display:none!important}.toast{color:var(--gold);font-weight:800}.small{font-size:12px;color:var(--muted)}@media(max-width:680px){.layout{grid-template-columns:1fr}.side{order:2}.team{grid-template-columns:repeat(2,minmax(0,1fr))}.app{padding:9px}.main{padding:8px}.side{padding:10px}.screen{border-width:2px}}@media(min-width:681px){.controls{display:none}}
</style></head><body><div class="app">
<header class="top"><div><div class="brand">✦ WILDBOUND</div><div class="small">EMBER ISLES · A CREATURE ADVENTURE</div></div><div class="tabs"><button id="saveBtn">💾 Save</button><button id="menuBtn">☰ Menu</button></div></header>
<div class="layout"><section class="main"><div class="screen"><canvas id="world" width="480" height="320"></canvas></div><div class="caption"><span id="place">🌿 Meadow Path</span><span id="weather">A new adventure awaits</span></div><div class="controls"><span class="blank"></span><button data-dir="up">▲</button><span class="blank"></span><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div><div class="actions"><button id="interact" class="primary">Talk / Interact</button><button id="bag">🎒 Bag</button><button id="dex">📖 Field Guide</button><button id="heal">💚 Rest team</button></div><div class="log" id="log">Welcome to the Ember Isles! Move with the arrow keys or the controls. Explore the tall grass to meet wild creatures.</div></section>
<aside class="side"><h3>YOUR CREW <span class="small" id="count"></span></h3><div class="team" id="team"></div><div class="log"><b>Trainer</b><div id="trainer">Rookie · 0 badges</div><div class="bar"><i id="xpbar" style="width:0%"></i></div><div class="small" id="progress">First steps on the island</div></div><div class="actions"><button id="mapBtn">🗺️ Map</button><button id="helpBtn">❔ How to play</button></div></aside></div></div>
<div class="overlay" id="overlay"><div class="dialog" id="dialog"></div></div>
<script>
const $=s=>document.querySelector(s), canvas=$('#world'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
const species=[
{id:'cinderkit',name:'Cinderkit',type:'Flame',emoji:'🦊',color:'#f18b55',hp:25,atk:8,def:4,moves:['Ember Pounce','Spark Flick'],desc:'A bold little fox that stores warmth in its tail.'},
{id:'mossling',name:'Mossling',type:'Leaf',emoji:'🐢',color:'#7fbd79',hp:29,atk:6,def:6,moves:['Vine Whip','Seed Shot'],desc:'A patient forest wanderer with a garden on its shell.'},
{id:'bubblit',name:'Bubblit',type:'Tide',emoji:'🦦',color:'#6bbfe7',hp:27,atk:7,def:5,moves:['Bubble Pop','Rushing Splash'],desc:'A playful river sprite that rides rolling waves.'},
{id:'pebblit',name:'Pebblit',type:'Stone',emoji:'🦔',color:'#b9a58b',hp:30,atk:7,def:7,moves:['Rock Toss','Rollout'],desc:'A sturdy burrower with a shell like polished granite.'},
{id:'voltkit',name:'Voltkit',type:'Spark',emoji:'🐈',color:'#f2d45c',hp:22,atk:9,def:3,moves:['Static Snap','Quick Zap'],desc:'A curious kitten whose whiskers crackle with energy.'},
{id:'florabbit',name:'Florabbit',type:'Leaf',emoji:'🐇',color:'#9fd18a',hp:24,atk:7,def:4,moves:['Petal Dart','Root Snare'],desc:'A swift meadow hopper with blossoms on its ears.'},
{id:'drizzlefin',name:'Drizzlefin',type:'Tide',emoji:'🐬',color:'#78c9e9',hp:26,atk:8,def:4,moves:['Wave Dash','Mist Veil'],desc:'A bright finned swimmer that calls the rain.'},
{id:'embercub',name:'Embercub',type:'Flame',emoji:'🐻',color:'#e9814d',hp:31,atk:9,def:5,moves:['Coal Claw','Roar'],desc:'A brave cub whose paws leave tiny glowing prints.'},
{id:'cragoon',name:'Cragoon',type:'Stone',emoji:'🦎',color:'#ad9b87',hp:34,atk:8,def:8,moves:['Boulder Bash','Dust Guard'],desc:'A rocky guardian that naps beneath warm cliffs.'},
{id:'glimmermoth',name:'Glimmermoth',type:'Spark',emoji:'🦋',color:'#f4df87',hp:23,atk:8,def:3,moves:['Flash Wing','Glow Dust'],desc:'Its wings shimmer like lanterns at dusk.'},
{id:'noctowl',name:'Noctowllet',type:'Shade',emoji:'🦉',color:'#a99ad2',hp:28,atk:10,def:4,moves:['Night Peck','Moonbeam'],desc:'A quiet night scout with a surprisingly brave heart.'},
{id:'frostpaw',name:'Frostpaw',type:'Frost',emoji:'🐺',color:'#b7e1ed',hp:29,atk:9,def:5,moves:['Snow Pounce','Chill Breath'],desc:'A mountain pup whose fur sparkles with frost.'}
];
const typeStrong={Flame:'Leaf',Leaf:'Tide',Tide:'Flame',Spark:'Tide',Stone:'Spark',Frost:'Leaf',Shade:'Spark'};
let state={name:'Rookie',team:[],items:{orbs:5,potions:3},x:8,y:7,map:'meadow',steps:0,xp:0,badges:0,seen:[],caught:[],flags:{guide:false,forest:false},coins:120};
function makeMon(id,level=3){let s=species.find(x=>x.id===id)||species[0],max=s.hp+level*3;return{id:s.id,level,xp:0,hp:max,max,atk:s.atk+level,def:s.def+Math.floor(level/2),name:s.name};}
const maps={
meadow:{name:'Meadow Path',emoji:'🌿',base:'#7ebd75',blocks:[[0,0,20,1],[0,13,20,1],[0,0,1,14],[19,0,1,14],[4,3,1,3],[5,3,3,1],[13,2,1,4],[14,5,3,1],[3,10,4,1],[14,9,1,3]],grass:[[2,2,3,2],[8,3,3,2],[12,9,4,2],[5,7,2,2]],npc:[{x:9,y:7,kind:'guide'}],gate:{x:18,y:11,to:'village',tx:2,ty:6}},
village:{name:'Willowbrook Village',emoji:'🏡',base:'#c4a879',blocks:[[0,0,20,1],[0,13,20,1],[0,0,1,14],[19,0,1,14],[4,3,4,3],[12,2,4,4],[5,9,3,2],[13,9,3,2]],grass:[],npc:[{x:9,y:6,kind:'healer'},{x:10,y:10,kind:'elder'}],gate:{x:1,y:6,to:'meadow',tx:17,ty:11},gate2:{x:18,y:6,to:'forest',tx:2,ty:10}},
forest:{name:'Whispering Woods',emoji:'🌲',base:'#3d8159',blocks:[[0,0,20,1],[0,13,20,1],[0,0,1,14],[19,0,1,14],[3,2,2,2],[8,1,2,3],[14,3,3,2],[5,9,2,3],[12,9,3,2]],grass:[[2,2,4,3],[7,6,5,3],[13,7,5,4]],npc:[{x:10,y:5,kind:'ranger'}],gate:{x:1,y:10,to:'village',tx:17,ty:6}}
};
const tile=24;
function blocked(x,y){let m=maps[state.map];if(x<0||y<0||x>=20||y>=13)return true;if(m.blocks.some(([a,b,w,h])=>x>=a&&x<a+w&&y>=b&&y<b+h))return true;return m.npc.some(n=>n.x===x&&n.y===y);}
function inGrass(x,y){return(maps[state.map].grass||[]).some(([a,b,w,h])=>x>=a&&x<a+w&&y>=b&&y<b+h);}
function box(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function draw(){let m=maps[state.map];box(0,0,480,320,m.base);for(let y=0;y<13;y++)for(let x=0;x<20;x++){let px=x*24,py=y*24;ctx.fillStyle=((x+y)%2?'#ffffff08':'#061b1608');ctx.fillRect(px,py,24,24);if(inGrass(x,y)){box(px+2,py+8,4,13,'#2d7945');box(px+9,py+3,4,18,'#3c9852');box(px+16,py+7,5,14,'#276c40');}}
if(state.map==='village'){for(let [x,y,c] of [[4,3,'#d46e55'],[12,2,'#779bc1'],[5,9,'#d7b66d'],[13,9,'#a97ac2']]){box(x*24-3,y*24-7,4*24,3*24,c);box(x*24+7,y*24-15,4*24-14,12,'#6b4437');box(x*24+25,y*24+12,17,25,'#5a3e31');}}
if(state.map==='meadow'){box(17*24,10*24,24,48,'#4f9bba');box(17*24,10*24,24,5,'#a8e5f1');}
if(state.map==='forest'){for(let [x,y] of [[3,2],[8,1],[14,3],[5,9],[12,9]]){box(x*24+5,y*24+10,13,14,'#674b35');ctx.fillStyle='#174e3b';ctx.beginPath();ctx.moveTo(x*24+12,y*24-10);ctx.lineTo(x*24-2,y*24+13);ctx.lineTo(x*24+26,y*24+13);ctx.fill();}}
m.npc.forEach(n=>{ctx.font='20px serif';ctx.fillText(n.kind==='healer'?'🧑‍⚕️':n.kind==='guide'?'🧑‍🌾':n.kind==='elder'?'🧙':'🧭',n.x*24+1,n.y*24+21)});
ctx.font='20px serif';ctx.fillText('🧢',state.x*24+1,state.y*24+21);ctx.fillStyle='#fff';ctx.fillRect(state.x*24+7,state.y*24+21,10,2);$('#place').textContent=m.emoji+' '+m.name;$('#weather').textContent=state.steps+' steps explored';}
function say(t){$('#log').textContent=t}
function move(dx,dy){if($('#overlay').style.display==='flex')return;let x=state.x+dx,y=state.y+dy,m=maps[state.map];if(m.gate&&x===m.gate.x&&y===m.gate.y){changeMap(m.gate.to,m.gate.tx,m.gate.ty);return}if(m.gate2&&x===m.gate2.x&&y===m.gate2.y){changeMap(m.gate2.to,m.gate2.tx,m.gate2.ty);return}if(blocked(x,y))return;state.x=x;state.y=y;state.steps++;draw();save(false);if(inGrass(x,y)&&Math.random()<.19)encounter();}
function changeMap(map,x,y){state.map=map;state.x=x;state.y=y;draw();say('You arrived at '+maps[map].name+'. Keep exploring!');if(map==='forest')state.flags.forest=true;save(false)}
function nearNpc(){return maps[state.map].npc.find(n=>Math.abs(n.x-state.x)+Math.abs(n.y-state.y)<=1)}
function interact(){let n=nearNpc();if(!n){say('Nothing nearby to interact with. Look for people and paths.');return}if(n.kind==='guide'){state.flags.guide=true;dialog('<h2>🌱 Welcome, new explorer!</h2><p>The tall grass is full of wild creatures. We know seven types across these islands. Weaken a wild creature, then toss a capture orb!</p><p>Try to build a team of six. The village healer can restore everyone.</p><button class="primary" id="ok">Let’s go!</button>');}if(n.kind==='healer'){state.team.forEach(m=>m.hp=m.max);say('The village healer restored your whole crew. You’re ready!');renderTeam();}if(n.kind==='elder'){dialog('<h2>🧙 The Island Elder</h2><p>Beyond the village lies Whispering Woods. A ranger there is looking for a brave challenger. Collect creatures, train them, and earn your first badge.</p><button class="primary" id="ok">I’m on my way!</button>');}if(n.kind==='ranger'){dialog('<h2>🧭 Ranger Rowan</h2><p>Let’s see what you’ve learned! I’ll send out a strong creature. Win this match and earn the Meadow Badge.</p><button class="primary" id="rangerBattle">Challenge!</button>');$('#rangerBattle').onclick=()=>{close();startBattle(makeMon('cragoon',5),true)}}}
function dialog(html){$('#dialog').innerHTML=html;$('#overlay').style.display='flex';$('#ok')?.addEventListener('click',close)}
function close(){$('#overlay').style.display='none'}
function encounter(){let pool=state.map==='forest'?['noctowl','frostpaw','cragoon','glimmermoth','florabbit','embercub']:['pebblit','voltkit','florabbit','drizzlefin','embercub','mossling'];let id=pool[Math.floor(Math.random()*pool.length)],level=state.map==='forest'?4+Math.floor(Math.random()*4):2+Math.floor(Math.random()*3);startBattle(makeMon(id,level),false)}
let battle=null;
function startBattle(wild,boss){if(!state.team.length){say('Choose a starter first!');return}battle={wild,boss,turn:'player',ended:false,active:0};state.seen.push(wild.id);renderBattle();$('#overlay').style.display='flex'}
function renderBattle(){let b=battle,p=state.team[b.active],w=species.find(s=>s.id===b.wild.id);$('#dialog').innerHTML='<h2>'+(b.boss?'⚔️ Ranger Challenge':'🌾 A wild '+w.name+' appeared!')+'</h2><div class="battlefield"><div><div class="status"><b>'+p.name+' · Lv '+p.level+'</b><div class="bar"><i style="width:'+100*p.hp/p.max+'%"></i></div>HP '+p.hp+'/'+p.max+'</div><div class="creature">'+(species.find(s=>s.id===p.id).emoji)+'</div></div><div><div class="status"><b>'+w.name+' · Lv '+b.wild.level+'</b><div class="bar"><i style="width:'+100*b.wild.hp/b.wild.max+'%"></i></div>HP '+b.wild.hp+'/'+b.wild.max+'</div><div class="creature">'+w.emoji+'</div></div></div><div class="log" id="battleLog">'+(b.message||'What will '+p.name+' do?')+'</div><div class="battle-actions"><button class="primary" id="move1">'+pMove(p,0)+'</button><button class="primary" id="move2">'+pMove(p,1)+'</button><button id="orb">🔵 Capture orb ('+state.items.orbs+')</button><button id="potion">🧪 Potion ('+state.items.potions+')</button><button id="run">🏃 Retreat</button><button id="switch">🔄 Switch</button></div>';$('#move1').onclick=()=>playerAttack(0);$('#move2').onclick=()=>playerAttack(1);$('#orb').onclick=capture;$('#potion').onclick=usePotion;$('#run').onclick=()=>{if(b.boss){battle.message='You cannot retreat from a trainer challenge.';renderBattle()}else{close();say('You safely left the encounter.')}};$('#switch').onclick=switchMon;}
function pMove(p,i){let s=species.find(x=>x.id===p.id);return (s.moves[i]||'Quick Strike')}
function playerAttack(which){if(!battle||battle.ended)return;let p=state.team[battle.active],w=battle.wild,ps=species.find(s=>s.id===p.id),ws=species.find(s=>s.id===w.id),power=which===0?1:1.25,damage=Math.max(2,Math.floor((p.atk*power+Math.random()*5)-w.def*.45));let strong=typeStrong[ps.type]===ws.type;if(strong)damage=Math.floor(damage*1.5);w.hp=Math.max(0,w.hp-damage);battle.message=p.name+' used '+pMove(p,which)+'! '+(strong?'It was super effective! ':'')+' '+ws.name+' lost '+damage+' HP.';if(w.hp===0){winBattle();return}enemyTurn()}
function enemyTurn(){let p=state.team[battle.active],w=battle.wild,damage=Math.max(2,Math.floor(w.atk+Math.random()*4-p.def*.35));p.hp=Math.max(0,p.hp-damage);battle.message+=' '+species.find(s=>s.id===w.id).name+' counterattacked for '+damage+' damage.';if(p.hp===0){let next=state.team.findIndex(m=>m.hp>0);if(next<0){state.team.forEach(m=>m.hp=Math.max(1,Math.floor(m.max*.35)));battle.message+=' Your crew was exhausted and recovered at the village.';close();say(battle.message);renderTeam();return}battle.active=next;battle.message+=' '+state.team[next].name+' steps up!'}renderBattle()}
function winBattle(){let p=state.team[battle.active],w=battle.wild;let earned=w.level*8;p.xp+=earned;state.xp+=earned;let levelUps=0;while(p.xp>=p.level*18){p.xp-=p.level*18;p.level++;p.max+=3;p.hp=Math.min(p.max,p.hp+7);p.atk++;p.def++;levelUps++}battle.ended=true;if(battle.boss){state.badges++;state.coins+=80;battle.message='Victory! You earned the Meadow Badge and 80 coins!';}else battle.message='You won! '+p.name+' gained '+earned+' XP.'+(levelUps?' Level up! Now level '+p.level+'!':'');renderBattle();$('#dialog').insertAdjacentHTML('beforeend','<button class="primary" id="finish" style="width:100%;margin-top:10px">Continue</button>');$('#finish').onclick=()=>{close();say(battle.message);renderTeam();save(false)}}
function capture(){let b=battle;if(b.boss){battle.message='Trainer battles are for earning badges—no captures here!';renderBattle();return}if(!state.items.orbs){battle.message='You are out of capture orbs!';renderBattle();return}state.items.orbs--;let chance=.28+.55*(1-b.wild.hp/b.wild.max);if(Math.random()<chance){let id=b.wild.id;if(state.team.length<6)state.team.push({...b.wild});state.caught.push(id);battle.message='Captured '+species.find(s=>s.id===id).name+'! '+(state.team.length<=6?'It joined your crew.':'Your crew is full; it was added to your field guide.');battle.ended=true;renderBattle();$('#dialog').insertAdjacentHTML('beforeend','<button class="primary" id="finish" style="width:100%;margin-top:10px">Continue</button>');$('#finish').onclick=()=>{close();say(battle.message);renderTeam();save(false)}}else{battle.message='The orb shook... and the creature broke free!';enemyTurn()}}
function usePotion(){if(!state.items.potions){battle.message='No potions left.';renderBattle();return}let p=state.team[battle.active];if(p.hp===p.max){battle.message='That creature is already at full health.';renderBattle();return}state.items.potions--;p.hp=Math.min(p.max,p.hp+18);battle.message=p.name+' recovered 18 HP.';enemyTurn()}
function switchMon(){let alive=state.team.map((m,i)=>({m,i})).filter(x=>x.m.hp>0&&x.i!==battle.active);if(!alive.length){battle.message='No other healthy creatures to switch to.';renderBattle();return}battle.active=alive[0].i;battle.message='Go, '+state.team[battle.active].name+'!';enemyTurn()}
function renderTeam(){$('#count').textContent='('+state.team.length+'/6)';$('#team').innerHTML=state.team.map(m=>{let s=species.find(x=>x.id===m.id);return '<div class="mon"><div class="sprite">'+s.emoji+'</div><div><b>'+s.name+'</b><br><small>Lv '+m.level+' · '+s.type+' · '+m.hp+'/'+m.max+' HP</small><div class="bar"><i style="width:'+100*m.hp/m.max+'%"></i></div></div></div>'}).join('')||'<div class="small">Choose your first companion to begin.</div>';$('#trainer').textContent=state.name+' · '+state.badges+' badges · '+state.coins+' coins';$('#progress').textContent=state.caught.length+' captured · '+state.seen.length+' encounters';$('#xpbar').style.width=(state.xp%100)+'%'}
function starter(){dialog('<h2>🌅 Your journey begins!</h2><p>Professor Fern has three companions waiting for you. Choose your first creature. This choice is yours to keep!</p><div class="starter-grid">'+['cinderkit','mossling','bubblit'].map(id=>{let s=species.find(x=>x.id===id);return '<button class="starter" data-starter="'+id+'"><span>'+s.emoji+'</span><b>'+s.name+'</b><small>'+s.type+' · '+s.desc+'</small></button>'}).join('')+'</div>');document.querySelectorAll('[data-starter]').forEach(b=>b.onclick=()=>{state.team=[makeMon(b.dataset.starter,5)];close();say('You chose '+species.find(s=>s.id===b.dataset.starter).name+'! Your adventure starts now.');renderTeam();draw();save(false)})}
function showBag(){dialog('<h2>🎒 Explorer’s Bag</h2><p>🔵 Capture Orbs: <b>'+state.items.orbs+'</b></p><p>🧪 Potions: <b>'+state.items.potions+'</b></p><p>🪙 Coins: <b>'+state.coins+'</b></p><p class="small">Items are used during wild encounters. Visit the village to rest your crew.</p><button class="primary" id="ok">Close</button>')}
function showDex(){let rows=species.map(s=>'<div class="mon"><div class="sprite">'+(state.seen.includes(s.id)?s.emoji:'❔')+'</div><div><b>'+(state.seen.includes(s.id)?s.name:'Unknown creature')+'</b><br><small>'+(state.seen.includes(s.id)?s.type+' · '+s.desc:'Explore the islands to discover it.')+'</small></div></div>').join('');dialog('<h2>📖 Field Guide · '+state.seen.length+'/'+species.length+'</h2><div style="max-height:55vh;overflow:auto;display:grid;gap:6px">'+rows+'</div><button class="primary" id="ok" style="margin-top:10px">Close</button>')}
function showMap(){dialog('<h2>🗺️ Ember Isles</h2><p>🌿 Meadow Path — your starting area</p><p>🏡 Willowbrook Village — healer and wise elder</p><p>🌲 Whispering Woods — stronger wild creatures and Ranger Rowan</p><p class="small">Follow the paths to the east and south edges to travel between areas.</p><button class="primary" id="ok">Close</button>')}
function help(){dialog('<h2>How to play</h2><p><b>Explore:</b> Use the arrows or keyboard arrows/WASD to walk. Rustling tall grass can hide wild creatures.</p><p><b>Battle:</b> Pick a move. Some types are stronger against others. Weaken wild creatures before using an orb.</p><p><b>Grow:</b> Earn XP, level up, and build a crew of up to six. Visit the healer in Willowbrook.</p><p><b>Find the ranger:</b> The woods hold a challenge and your first badge.</p><button class="primary" id="ok">Got it!</button>')}
function save(show=true){try{localStorage.setItem('wildboundSave',JSON.stringify(state));if(show)say('Adventure saved on this device.')}catch(e){say('Could not save. Check device storage.')}}
function load(){try{let s=JSON.parse(localStorage.getItem('wildboundSave'));if(s&&s.team&&s.items)state={...state,...s}}catch(e){}}
function menu(){dialog('<h2>☰ Adventure Menu</h2><div class="actions"><button id="saveMenu">💾 Save</button><button id="newGame">✨ New adventure</button><button id="closeMenu">Return to game</button></div><p class="small">Your progress is saved on this device. Starting a new adventure replaces the current save.</p>');$('#saveMenu').onclick=()=>{save();close()};$('#closeMenu').onclick=close;$('#newGame').onclick=()=>{if(confirm('Start a brand-new adventure? Your current save will be replaced.')){localStorage.removeItem('wildboundSave');location.reload()}}}
document.querySelectorAll('[data-dir]').forEach(b=>{let d=b.dataset.dir,vec={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[d];b.addEventListener('click',()=>move(...vec))});
window.addEventListener('keydown',e=>{let d={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]}[e.key];if(d){e.preventDefault();move(...d)}if(e.key===' '||e.key==='Enter')interact()});
$('#interact').onclick=interact;$('#bag').onclick=showBag;$('#dex').onclick=showDex;$('#heal').onclick=()=>{state.team.forEach(m=>m.hp=m.max);renderTeam();say('Your team is fully rested!')};$('#mapBtn').onclick=showMap;$('#helpBtn').onclick=help;$('#saveBtn').onclick=()=>save();$('#menuBtn').onclick=menu;
load();renderTeam();draw();if(!state.team.length)starter();
</script><script src="./wildbound-extra.js"></script></body></html>
